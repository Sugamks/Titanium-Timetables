name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: master

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
          python -m pip install "pyinstaller>=6.10"

      - name: Install WiX
        run: |
          winget install --id WiXToolset.WiXCLI --exact --disable-interactivity --accept-package-agreements --accept-source-agreements
          $wix = Get-Command wix -ErrorAction SilentlyContinue
          if (-not $wix) {
            $wix = Get-ChildItem -Path "${env:ProgramFiles}\WiX Toolset*","${env:LOCALAPPDATA}\Microsoft\WinGet" -Recurse -Filter wix.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $wix) { throw "wix.exe was not found after install" }
          $dir = if ($wix.Source) { Split-Path $wix.Source } else { $wix.DirectoryName }
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Point updates at this repository
        shell: pwsh
        run: |
          Set-Content -Path apps\api\app\update_target.py -Encoding utf8 -Value "GITHUB_REPO = `"${{ github.repository }}`"`n"

      - name: Build MSI
        shell: pwsh
        run: |
          $match = Select-String -Path apps\api\app\version.py -Pattern 'APP_VERSION = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "APP_VERSION was not found" }
          $version = $match.Matches[0].Groups[1].Value
          powershell -ExecutionPolicy Bypass -File apps\desktop\package-windows.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: TitaniumTimetables-msi
          path: dist/TitaniumTimetables.msi
          if-no-files-found: error

      - name: Add MSI to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $match = Select-String -Path apps\api\app\version.py -Pattern 'APP_VERSION = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "APP_VERSION was not found" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = "v$version" }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/TitaniumTimetables.msi --target $env:RELEASE_SHA --title $version --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          } else {
            gh release upload $tag dist/TitaniumTimetables.msi --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          }
